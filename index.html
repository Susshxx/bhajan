<body>
    <div class="site-disclaimer">Disclaimer! This may not be the site you're looking for</div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="time">9:11 pm</div>
        <div class="online-status">
            <span class="online-dot"></span>
            <span class="online-count">0</span>
            <span>online</span>
        </div>
    </div>

    <!-- External Links -->
    <div class="external-links">
        <a href="https://music.youtube.com/playlist?list=PLM74qOWImQUo" target="_blank" class="link-btn">
            <i class="fab fa-youtube"></i> YT Music
        </a>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Title -->
        <h1 class="main-title">प्रिमियम<br>भजन</h1>

        <!-- Sound Control -->
        <div class="sound-control">
            <button class="sound-trigger" id="soundTrigger" aria-label="Play sound">
                <i class="fas fa-volume-up"></i>
            </button>
            <span class="sound-label">साङ्ख बजाउ</span>
        </div>

        <!-- Music Player -->
        <div class="music-player">
            <div class="album-art">
                <img src="bhajan.jpg" alt="Album Art" id="albumArt">
            </div>
            <div class="song-info">
                <div class="song-title" id="songTitle">नया शुद्ध नेपाली भजन</div>
                <div class="song-artist" id="songArtist">Sahima Music Official</div>
                <div class="progress-container">
                    <span class="current-time" id="currentTime">0:00</span>
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span class="duration" id="duration">0:00</span>
                    <button class="mode-btn active" id="modeToggleBtn" data-mode="order" title="Switch playback mode" aria-label="Switch playback mode">
                        <i class="fas fa-list-ul"></i>
                    </button>
                </div>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="prevBtn">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-btn play-btn" id="playBtn">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="nextBtn">
                    <i class="fas fa-step-forward"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="youtube-player" style="display: none;"></div>

    <!-- Background Illustration Effect -->
    <div class="bg-illustration"></div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
